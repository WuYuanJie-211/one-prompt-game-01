<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Dodge — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #05030f; height: 100%; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #070418; box-shadow: 0 0 60px rgba(120, 60, 255, .35); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<script>
'use strict';
/* Star Dodge — one prompt, one file. Arrow keys / mouse to fly, catch stars, dodge meteors. */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 1280, H = 720;
const params = new URLSearchParams(location.search);
const AUTOPLAY = params.get('autoplay') === '1';

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- audio (WebAudio synth, lazy init, silent if blocked) ---------- */
let AC = null;
function audio() {
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  return AC;
}
function blip(freq, dur, type, vol, slide) {
  const ac = audio(); if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
const sfxCollect = () => { blip(880, 0.12, 'sine', 0.12, 1320); };
const sfxHit = () => { blip(160, 0.3, 'sawtooth', 0.16, 55); };
const sfxOver = () => { blip(392, 0.18, 'triangle', 0.14); setTimeout(() => blip(311, 0.18, 'triangle', 0.14), 170); setTimeout(() => blip(233, 0.4, 'triangle', 0.14), 340); };

/* ---------- state ---------- */
const ship = { x: W / 2, y: H - 90, r: 22, vx: 0, invuln: 0 };
let stars = [], meteors = [], parts = [], bgStars = [];
let score = 0, lives = 3, level = 1, best = 0, shake = 0, flash = 0;
let state = 'title'; /* title | playing | over */
let spawnT = 0, starT = 0, elapsed = 0, last = performance.now();
try { best = +(localStorage.getItem('stardodge-best') || 0); } catch (e) {}

for (let i = 0; i < 110; i++)
  bgStars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + 0.4, tw: Math.random() * 6.28, sp: 0.4 + Math.random() * 1.2 });

const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  audio();
  if (e.key === ' ' || e.key === 'Enter') startGame();
  if ((e.key === 'r' || e.key === 'R') && state === 'over') startGame();
});
addEventListener('keyup', e => { keys[e.key] = false; });
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  ship.tx = (e.clientX - r.left) / r.width * W;
});
cv.addEventListener('mousedown', () => { audio(); if (state !== 'playing') startGame(); });

function startGame() {
  stars = []; meteors = []; parts = [];
  score = 0; lives = 3; level = 1; shake = 0; flash = 0;
  ship.x = W / 2; ship.invuln = 0; ship.tx = undefined;
  spawnT = 0; starT = 0; elapsed = 0;
  state = 'playing';
}
function levelOf(s) { return 1 + Math.floor(s / 150); }
function spawnMeteor() {
  const r = 18 + Math.random() * 28;
  meteors.push({ x: 30 + Math.random() * (W - 60), y: -r - 10, r,
    vy: 170 + Math.random() * 130 + level * 32, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 2.2,
    shade: 0.55 + Math.random() * 0.45 });
}
function spawnStar() {
  stars.push({ x: 30 + Math.random() * (W - 60), y: -20, r: 15, vy: 95 + Math.random() * 55, ph: Math.random() * 6.28 });
}
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = (0.3 + Math.random() * 0.7) * speed;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.5, max: 1, color, r: 2 + Math.random() * 3.5 });
  }
}
function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.hypot(dx, dy); }

/* ---------- autoplay driver (for the demo capture) ---------- */
function autopilot(dt) {
  if (state === 'title' || state === 'over') { if (state === 'over' && elapsed > 1.2) startGame(); else if (state === 'title') startGame(); return; }
  let target = null, td = 1e9;
  for (const s of stars) { const d = Math.abs(s.x - ship.x) + (ship.y - s.y) * 0.4; if (s.y < ship.y && d < td) { td = d; target = s; } }
  let tx = target ? target.x : W / 2;
  for (const m of meteors) {
    if (m.y > ship.y - 260 && m.y < ship.y + 40 && Math.abs(m.x - ship.x) < m.r + 55) {
      tx = ship.x + (m.x < ship.x ? 130 : -130); // dodge away
      break;
    }
  }
  tx = Math.max(30, Math.min(W - 30, tx));
  ship.x += (tx - ship.x) * Math.min(1, dt * 7);
}

/* ---------- update ---------- */
function update(dt) {
  elapsed += dt;
  for (const b of bgStars) { b.y += b.sp * dt * 14; b.tw += dt * 2; if (b.y > H) { b.y = -2; b.x = Math.random() * W; } }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  if (ship.invuln > 0) ship.invuln -= dt;
  if (state !== 'playing') return;

  level = levelOf(score);
  spawnT -= dt; starT -= dt;
  const spawnEvery = Math.max(0.34, 0.85 - level * 0.06);
  if (spawnT <= 0) { spawnMeteor(); spawnT = spawnEvery * (0.7 + Math.random() * 0.6); }
  if (starT <= 0) { spawnStar(); starT = 0.55 + Math.random() * 0.8; }

  if (AUTOPLAY) autopilot(dt);
  else {
    const sp = 520;
    if (keys.ArrowLeft || keys.a) ship.x -= sp * dt;
    if (keys.ArrowRight || keys.d) ship.x += sp * dt;
    if (ship.tx !== undefined) ship.x += (ship.tx - ship.x) * Math.min(1, dt * 12);
    ship.x = Math.max(28, Math.min(W - 28, ship.x));
  }
  ship.x = Math.max(28, Math.min(W - 28, ship.x));

  for (const m of meteors) { m.y += m.vy * dt; m.rot += m.vr * dt; }
  for (const s of stars) { s.y += s.vy * dt; s.ph += dt * 3; }
  meteors = meteors.filter(m => m.y < H + 60);
  stars = stars.filter(s => s.y < H + 30);

  for (const s of stars) {
    if (dist(s, ship) < s.r + ship.r - 6) {
      score += 10; s.y = H + 99; burst(s.x, s.y, '#ffd34d', 14, 260); sfxCollect();
    }
  }
  if (ship.invuln <= 0) {
    for (const m of meteors) {
      if (dist(m, ship) < m.r + ship.r - 10) {
        lives--; m.y = H + 99; shake = 14; flash = 0.7; ship.invuln = 1.6;
        burst(ship.x, ship.y, '#ff5a3c', 26, 380); burst(ship.x, ship.y, '#ffb03c', 16, 300); sfxHit();
        if (lives <= 0) {
          state = 'over'; sfxOver();
          if (score > best) { best = score; try { localStorage.setItem('stardodge-best', String(best)); } catch (e) {} }
        }
        break;
      }
    }
  }
}

/* ---------- draw ---------- */
function drawStar(x, y, r, color, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const rr = i % 2 === 0 ? r : r * 0.42, a = i * Math.PI / 4 - Math.PI / 2;
    ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0524'); g.addColorStop(0.55, '#12083a'); g.addColorStop(1, '#05030f');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  const neb = ctx.createRadialGradient(W * 0.78, H * 0.2, 20, W * 0.78, H * 0.2, 420);
  neb.addColorStop(0, 'rgba(150,60,255,0.20)'); neb.addColorStop(1, 'rgba(150,60,255,0)');
  ctx.fillStyle = neb; ctx.fillRect(0, 0, W, H);
  const neb2 = ctx.createRadialGradient(W * 0.12, H * 0.75, 20, W * 0.12, H * 0.75, 380);
  neb2.addColorStop(0, 'rgba(40,200,255,0.13)'); neb2.addColorStop(1, 'rgba(40,200,255,0)');
  ctx.fillStyle = neb2; ctx.fillRect(0, 0, W, H);
  for (const b of bgStars) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(b.tw));
    ctx.fillStyle = '#cfe4ff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const s of stars) {
    const pulse = 1 + 0.15 * Math.sin(s.ph);
    ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 18;
    drawStar(s.x, s.y, s.r * pulse, '#ffd34d');
    ctx.shadowBlur = 0;
  }
  for (const m of meteors) {
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.rot);
    ctx.fillStyle = '#8a6a52'; ctx.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * 6.283, rr = m.r * (0.82 + 0.18 * Math.sin(i * 2.7 + m.rot));
      ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(-m.r * 0.3, -m.r * 0.2, m.r * 0.22, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(m.r * 0.35, m.r * 0.3, m.r * 0.16, 0, 6.29); ctx.fill();
    ctx.strokeStyle = 'rgba(255,150,80,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, m.r * 0.92, 0.4, 1.5); ctx.stroke();
    ctx.restore();
  }
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (state !== 'over') {
    const blink = ship.invuln > 0 && Math.floor(elapsed * 14) % 2 === 0;
    if (!blink) {
      ctx.save(); ctx.translate(ship.x, ship.y);
      ctx.shadowColor = '#37e0ff'; ctx.shadowBlur = 22;
      const fl = 12 + 8 * Math.sin(elapsed * 22);
      ctx.fillStyle = '#ff9a3c';
      ctx.beginPath(); ctx.moveTo(-7, 16); ctx.lineTo(0, 16 + fl); ctx.lineTo(7, 16); ctx.closePath(); ctx.fill();
      const body = ctx.createLinearGradient(0, -26, 0, 18);
      body.addColorStop(0, '#8ef6ff'); body.addColorStop(0.5, '#37b6ff'); body.addColorStop(1, '#1a6cff');
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(15, 12); ctx.lineTo(7, 18); ctx.lineTo(-7, 18); ctx.lineTo(-15, 12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff5a7a';
      ctx.beginPath(); ctx.moveTo(-15, 4); ctx.lineTo(-26, 18); ctx.lineTo(-13, 16); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(15, 4); ctx.lineTo(26, 18); ctx.lineTo(13, 16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, -6, 5.5, 0, 6.29); ctx.fill();
      ctx.restore();
    }
  }

  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = '700 30px "DejaVu Sans", sans-serif'; ctx.textBaseline = 'top';
  ctx.textAlign = 'left'; ctx.fillText('SCORE ' + score, 24, 18);
  ctx.textAlign = 'center'; ctx.fillText('LEVEL ' + level, W / 2, 18);
  ctx.textAlign = 'right';
  let hearts = '';
  for (let i = 0; i < 3; i++) hearts += i < lives ? '♥ ' : '♡ ';
  ctx.fillStyle = '#ff5a7a'; ctx.fillText(hearts, W - 24, 18);
  ctx.textAlign = 'left';

  if (state === 'title') overlay('STAR DODGE', 'catch stars · dodge meteors · 3 lives', 'PRESS SPACE OR CLICK TO PLAY');
  if (state === 'over') overlay('GAME OVER', 'score ' + score + '   ·   best ' + best, 'PRESS R OR CLICK TO PLAY AGAIN');
  if (flash > 0) { ctx.fillStyle = 'rgba(255,60,40,' + (flash * 0.25) + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();
}
function overlay(title, sub, hint) {
  ctx.fillStyle = 'rgba(5,3,18,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#a64dff'; ctx.shadowBlur = 34;
  ctx.fillStyle = '#ffffff'; ctx.font = '800 92px "DejaVu Sans", sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 66);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#cfe4ff'; ctx.font = '400 30px "DejaVu Sans", sans-serif';
  ctx.fillText(sub, W / 2, H / 2 + 8);
  ctx.fillStyle = '#ffd34d'; ctx.font = '700 26px "DejaVu Sans", sans-serif';
  ctx.fillText(hint, W / 2, H / 2 + 66);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (AUTOPLAY) setTimeout(startGame, 600);
</script>
</body>
</html>
